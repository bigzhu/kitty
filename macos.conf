# 不再使用自动启动 tmux 的会话配置
# startup_session macos_launch.conf

# Font configuration for Nerd Font support (required for tmux Catppuccin theme icons)
font_family      "JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 13.0

open_url_with default

# Executable Paths
exe_search_path +/opt/homebrew/bin
exe_search_path +/usr/local/bin
